server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # у чанков имя с хешем, поэтому их можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой путь вроде /doctors/7 или /admin/appointments должен отдавать
    # index.html, иначе перезагрузка страницы внутри приложения даёт 404 от nginx
    location / {
        try_files $uri $uri/ /index.html;
    }
}
