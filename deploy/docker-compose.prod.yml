# Ometus на ometus.glossa.best.
#
# Сервер уже держит PostgreSQL и nginx для glossa.best, поэтому здесь нет ни того,
# ни другого: контейнеры подключаются к сети glossa_default, база живёт отдельной
# схемой в общем PostgreSQL, а трафик приводит nginx главного сайта.
#
# Портов наружу никто не публикует — снаружи виден только nginx.

name: ometus

services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../Backend/.env.prod
    command: >
      gunicorn app.main:app -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -
    networks:
      - glossa

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        # Vite вшивает адрес в бандл на сборке — после сборки его не поменять.
        # Здесь только origin: клиент сам дописывает /api/... к каждому пути.
        VITE_API_URL: https://ometus.glossa.best
    restart: unless-stopped
    networks:
      - glossa
    depends_on:
      - backend

networks:
  glossa:
    external: true
    name: glossa_default
